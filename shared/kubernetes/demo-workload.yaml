apiVersion: v1
kind: Namespace
metadata:
  name: secure-alb-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: secure-alb-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: echo
          image: public.ecr.aws/nginx/nginx:stable-alpine
          ports:
            - containerPort: 8080
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat >/etc/nginx/conf.d/default.conf <<'EOF'
              server {
                listen 8080;
                location / { return 200 '{"service":"secure-alb-demo","status":"ok"}\n'; add_header Content-Type application/json; }
                location /health { return 200 'healthy\n'; add_header Content-Type text/plain; }
              }
              EOF
              exec nginx -g 'daemon off;'
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: secure-alb-demo
spec:
  selector:
    app: demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
