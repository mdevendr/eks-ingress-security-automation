<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Stage 2 kro SecureALB platform architecture</title>
  <desc id="desc">An application team submits a SecureALB custom resource. A platform-authored ResourceGraphDefinition and WAF policy catalogue are consumed by kro, which creates TargetGroupConfiguration, LoadBalancerConfiguration, Gateway, HTTPRoute and ACK Route 53 HealthCheck resources. AWS controllers then create the ALB, WAF association, DNS record and health check. Admission policy and RBAC form an independent guardrail.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#425466"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1769aa"/></marker>
    <style>
      .bg{fill:#f7f9fc}.band{fill:#eef3f8;stroke:#c7d3df;stroke-width:2}.node{fill:#fff;stroke:#8193a6;stroke-width:2}.platform{fill:#e8f2ff;stroke:#1769aa;stroke-width:2}.security{fill:#fff3d9;stroke:#b7791f;stroke-width:2}.aws{fill:#fff7ea;stroke:#d97706;stroke-width:2}.guard{fill:#f7eafa;stroke:#8a3fa0;stroke-width:2}.title{font:700 34px Arial,sans-serif;fill:#182230}.subtitle{font:400 19px Arial,sans-serif;fill:#526172}.h{font:700 20px Arial,sans-serif;fill:#182230}.t{font:600 17px Arial,sans-serif;fill:#25364a}.s{font:400 14px Arial,sans-serif;fill:#526172}.lane{font:700 17px Arial,sans-serif;fill:#526172;letter-spacing:1px}.edge{fill:none;stroke:#425466;stroke-width:2.5;marker-end:url(#arrow)}.blue{fill:none;stroke:#1769aa;stroke-width:3;marker-end:url(#blueArrow)}.dash{fill:none;stroke:#8a3fa0;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="920"/>
  <text class="title" x="55" y="55">Stage 2 — SecureALB as a governed platform API</text>
  <text class="subtitle" x="55" y="88">kro composes the proven Gateway API graph; admission, RBAC and reconciliation remain independent controls.</text>

  <rect class="band" x="45" y="120" width="250" height="730" rx="20"/><text class="lane" x="75" y="155">APPLICATION CONTRACT</text>
  <rect class="band" x="325" y="120" width="430" height="730" rx="20"/><text class="lane" x="355" y="155">PLATFORM COMPOSITION</text>
  <rect class="band" x="785" y="120" width="410" height="730" rx="20"/><text class="lane" x="815" y="155">RENDERED RESOURCES</text>
  <rect class="band" x="1225" y="120" width="330" height="730" rx="20"/><text class="lane" x="1255" y="155">EFFECTIVE STATE</text>

  <rect class="node" x="75" y="210" width="190" height="80" rx="14"/><text class="t" x="170" y="242" text-anchor="middle">Application team</text><text class="s" x="170" y="268" text-anchor="middle">hostname · service · policy</text>
  <rect class="platform" x="70" y="365" width="200" height="155" rx="16"/><text class="h" x="170" y="405" text-anchor="middle">SecureALB</text><text class="s" x="170" y="435" text-anchor="middle">platform.eks.example/v1alpha1</text><text class="s" x="170" y="466" text-anchor="middle">wafPolicyRef:</text><text class="t" x="170" y="491" text-anchor="middle">regulated-public</text>
  <path class="blue" d="M170 290 L170 355"/>

  <rect class="platform" x="365" y="200" width="350" height="120" rx="16"/><text class="h" x="540" y="238" text-anchor="middle">ResourceGraphDefinition</text><text class="s" x="540" y="267" text-anchor="middle">platform-authored schema and resource graph</text><text class="s" x="540" y="292" text-anchor="middle">defines the SecureALB API</text>
  <rect class="security" x="365" y="365" width="350" height="105" rx="16"/><text class="h" x="540" y="402" text-anchor="middle">Approved WAF policy catalogue</text><text class="s" x="540" y="430" text-anchor="middle">ConfigMap externalRef resolves logical policy</text><text class="s" x="540" y="453" text-anchor="middle">No raw WebACL ARN in the app contract</text>
  <rect class="platform" x="425" y="560" width="230" height="105" rx="52"/><text class="h" x="540" y="605" text-anchor="middle">kro controller</text><text class="s" x="540" y="633" text-anchor="middle">renders and reconciles graph</text>
  <path class="edge" d="M270 442 L415 600"/><path class="edge" d="M540 320 L540 550"/><path class="edge" d="M540 470 L540 550"/>

  <rect class="node" x="825" y="190" width="330" height="82" rx="14"/><text class="t" x="990" y="222" text-anchor="middle">TargetGroupConfiguration</text><text class="s" x="990" y="249" text-anchor="middle">IP targets · HTTP health checks</text>
  <rect class="security" x="825" y="292" width="330" height="120" rx="14"/><text class="t" x="990" y="324" text-anchor="middle">LoadBalancerConfiguration</text><text class="s" x="990" y="351" text-anchor="middle">TLS · WAF · access logs</text><text class="s" x="990" y="376" text-anchor="middle">drop invalid headers · security tags</text><text class="s" x="990" y="399" text-anchor="middle">references target-group configuration</text>
  <rect class="node" x="825" y="432" width="330" height="82" rx="14"/><text class="t" x="990" y="464" text-anchor="middle">Gateway</text><text class="s" x="990" y="491" text-anchor="middle">HTTPS listener · platform parametersRef</text>
  <rect class="node" x="825" y="534" width="330" height="82" rx="14"/><text class="t" x="990" y="566" text-anchor="middle">HTTPRoute</text><text class="s" x="990" y="593" text-anchor="middle">hostname · path · backend service</text>
  <rect class="node" x="825" y="636" width="330" height="92" rx="14"/><text class="t" x="990" y="669" text-anchor="middle">ACK Route 53 HealthCheck</text><text class="s" x="990" y="696" text-anchor="middle">HTTPS /health · declarative lifecycle</text>
  <path class="edge" d="M655 612 C730 612 740 231 815 231"/><path class="edge" d="M655 612 C735 612 745 352 815 352"/><path class="edge" d="M655 612 C735 612 745 473 815 473"/><path class="edge" d="M655 612 L815 575"/><path class="edge" d="M655 612 L815 682"/>

  <rect class="aws" x="1260" y="200" width="260" height="115" rx="16"/><text class="h" x="1390" y="238" text-anchor="middle">AWS Load Balancer</text><text class="h" x="1390" y="264" text-anchor="middle">Controller</text><text class="s" x="1390" y="292" text-anchor="middle">ALB · listener · target group</text>
  <rect class="security" x="1260" y="345" width="260" height="105" rx="16"/><text class="h" x="1390" y="383" text-anchor="middle">Security configuration</text><text class="s" x="1390" y="411" text-anchor="middle">WAF association · logs · TLS</text><text class="s" x="1390" y="435" text-anchor="middle">Shield configuration when enabled</text>
  <rect class="aws" x="1260" y="480" width="260" height="90" rx="16"/><text class="h" x="1390" y="516" text-anchor="middle">ExternalDNS</text><text class="s" x="1390" y="544" text-anchor="middle">Route 53 record from HTTPRoute</text>
  <rect class="aws" x="1260" y="600" width="260" height="90" rx="16"/><text class="h" x="1390" y="636" text-anchor="middle">ACK controller</text><text class="s" x="1390" y="664" text-anchor="middle">Route 53 health check</text>
  <path class="edge" d="M1155 352 L1250 270"/><path class="edge" d="M1155 473 L1250 285"/><path class="edge" d="M1155 575 L1250 525"/><path class="edge" d="M1155 682 L1250 645"/><path class="edge" d="M1390 315 L1390 335"/>

  <rect class="guard" x="350" y="760" width="805" height="62" rx="14"/><text class="t" x="752" y="787" text-anchor="middle">Independent guardrail: ValidatingAdmissionPolicy + RBAC</text><text class="s" x="752" y="810" text-anchor="middle">Rejects unknown WAF policies and unsafe direct overrides, whether or not kro is used</text>
  <path class="dash" d="M350 790 L280 790 L280 520"/>
  <text class="s" x="1290" y="790">Runtime inventory is written by the</text><text class="s" x="1290" y="812">event gap-filler — not by kro.</text>
</svg>
